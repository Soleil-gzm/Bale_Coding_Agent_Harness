[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bale-harness"
version = "0.1.0"
description = "Contracts and entry points for the Bale Coding Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp==1.30.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.12,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pip-tools>=7.4,<8",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
bale = "bale_harness.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
